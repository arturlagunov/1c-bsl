[package]
name = "zed-1c-bsl"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zed_extension_api = "0.7.0"
miniz_oxide = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
